name: correctness
on: [push, pull_request]

jobs:
  linux:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - build_type: Release
            sanitizers: "OFF"
          - build_type: Debug
            sanitizers: "ON"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y libgtest-dev
      - run: python -m pip install -r requirements-dev.txt
      - run: ruff check scripts tests && ruff format --check scripts tests
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DNETBENCH_SANITIZERS=${{ matrix.sanitizers }}
      - run: cmake --build build -j 2
      - run: ctest --test-dir build --output-on-failure
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1
